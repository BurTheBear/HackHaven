<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
html, body {
	background: #000;
	color: #3df5ff;
	width: 100%;
	height: 100%;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background: #000;
}
#canvas:focus {
	outline: none;
}
#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #000;
	font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
	letter-spacing: 0.35em;
	transition: opacity 0.8s ease;
}
#status.fade {
	opacity: 0;
	pointer-events: none;
}
#status-title {
	font-size: 14px;
	color: rgba(61, 245, 255, 0.55);
	margin-bottom: 18px;
	padding-left: 0.35em;
}
#status-bar {
	width: min(320px, 60vw);
	height: 1px;
	background: rgba(61, 245, 255, 0.12);
	overflow: hidden;
	position: relative;
}
#status-fill {
	width: 0%;
	height: 100%;
	background: #3df5ff;
	box-shadow: 0 0 8px #3df5ff;
	transition: width 0.2s linear;
}
#status-bar.indeterminate #status-fill {
	width: 30%;
	position: absolute;
	animation: sweep 1.4s ease-in-out infinite;
}
@keyframes sweep {
	from { left: -30%; }
	to { left: 100%; }
}
#status-notice {
	margin-top: 22px;
	max-width: 80vw;
	font-size: 13px;
	letter-spacing: 0.08em;
	line-height: 1.6;
	color: #ff3b4e;
	text-align: center;
	white-space: pre-line;
	display: none;
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">
	Your browser does not support the canvas tag.
</canvas>
<noscript>
	Your browser does not support JavaScript.
</noscript>
<div id="status">
	<div id="status-title">ECHO</div>
	<div id="status-hook" style="color:#9fb4bf;font-size:15px;margin:-6px 0 14px;text-align:center">What if the only way to see was to make noise?</div>
	<div id="status-bar" class="indeterminate"><div id="status-fill"></div></div>
	<div id="status-notice"></div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
// Robust even if a Godot version doesn't replace this placeholder.
const GODOT_THREADS_ENABLED = String('$GODOT_THREADS_ENABLED') === 'true';
const engine = new Engine(GODOT_CONFIG);

(function () {
	const status = document.getElementById('status');
	const bar = document.getElementById('status-bar');
	const fill = document.getElementById('status-fill');
	const notice = document.getElementById('status-notice');

	function showNotice(text) {
		notice.textContent = text;
		notice.style.display = 'block';
		bar.style.display = 'none';
	}

	function fail(err) {
		console.error(err);
		const msg = (err && err.message) ? err.message : String(err);
		showNotice('The cave would not open.\n' + msg);
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showNotice('This browser is missing features ECHO needs:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('indeterminate');
				fill.style.width = Math.min(100, (current / total) * 100) + '%';
			} else {
				bar.classList.add('indeterminate');
			}
		},
	}).then(function () {
		status.classList.add('fade');
		setTimeout(function () { status.style.display = 'none'; }, 900);
	}, fail);
}());
</script>
</body>
</html>
